<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --text:#1d1d1f; --muted:#7a7c85; --accent:#3d5afe; --user:#3d5afe; --bot:#fff; --border:#e2e4ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16171b; --card:#202227; --text:#ececef; --muted:#9a9ca6; --bot:#2a2c33; --border:#33363e; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
    .app { max-width:760px; height:100dvh; margin:0 auto; display:flex; flex-direction:column; background:var(--card); border-inline:1px solid var(--border); }

    header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); }
    .avatar { width:40px; height:40px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:20px; flex-shrink:0; }
    header b { display:block; }
    header small { color:#2bb673; }

    #log { flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:10px; background:var(--bg); }
    .day { align-self:center; font-size:12px; color:var(--muted); background:var(--card); padding:2px 10px; border-radius:10px; }
    .msg { max-width:75%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
    .msg time { display:block; font-size:11px; opacity:.6; text-align:right; margin-top:2px; }
    .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
    .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }

    form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); }
    input { flex:1; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:10px 16px; }
    input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
    button { width:44px; border:0; border-radius:50%; background:var(--accent); color:#fff; font-size:18px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }

    header label { margin-left:auto; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; }
    .meta { display:block; font-size:11px; color:var(--muted); margin-top:4px; font-family:ui-monospace, monospace; white-space:normal; }
    .blocked { border:1px solid #e5484d; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">🤖</div>
      <div><b>Чат-бот</b><small>● в сети</small></div>
      <label><input type="checkbox" id="guard" checked> Включить guard</label>
    </header>

    <div id="log">
      <div class="day">Сегодня</div>
      <div class="msg bot">Привет! Чем могу помочь?</div>
    </div>

    <form id="form">
      <input id="input" placeholder="Напишите сообщение…" autocomplete="off">
      <button title="Отправить">➤</button>
    </form>
  </div>

<script>
  // Отправляем сообщение на /api/chat и показываем ответ + вердикт guard (stage).
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const button = document.querySelector('#form button');
  const guard = document.getElementById('guard');

  function addMsg(cls, text, meta) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    if (meta) {
      const m = document.createElement('span');
      m.className = 'meta';
      m.textContent = 'stage: ' + meta.stage + (meta.guard ? ' · guard: ' + meta.guard.replace('\n', ' ') : '');
      el.appendChild(m);
    }
    const t = document.createElement('time');
    t.textContent = new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    el.appendChild(t);
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    input.value = '';
    button.disabled = true;
    const pending = addMsg('bot', 'печатает…');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, use_guard: guard.checked }),
      });
      const data = await res.json();
      pending.remove();
      const el = addMsg('bot', data.reply, data.meta);
      if (data.meta && data.meta.stage.endsWith('_blocked')) el.classList.add('blocked');
    } catch (err) {
      pending.remove();
      addMsg('bot', '[Ошибка сети: ' + err + ']');
    } finally {
      button.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
